<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b21">
<title>HadesScience</title>
<link rel="canonical" href="https://hadesscience.com/zh-cn/">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=brand-fixed-20261018">
<script>
(() => {
  const paths = {'zh-CN':'/zh-cn/','zh-Hant':'/zh-hant/','en':'/en/','ja':'/ja/','ru':'/ru/'};
  const match = value => {
    if (typeof value !== 'string') return null;
    const parts = value.trim().replace(/_/g, '-').toLowerCase().split('-');
    if (parts[0] === 'zh') {
      if (parts.includes('hant')) return 'zh-Hant';
      if (parts.includes('hans')) return 'zh-CN';
      return parts.some(part => ['tw', 'hk', 'mo'].includes(part)) ? 'zh-Hant' : 'zh-CN';
    }
    return ['en', 'ja', 'ru'].includes(parts[0]) ? parts[0] : null;
  };
  let saved;
  try { saved = localStorage.getItem('hs-language'); } catch {}
  let target = paths[saved];
  if (!target) {
    const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
    for (const language of languages) {
      const locale = match(language);
      if (locale) { target = paths[locale]; break; }
    }
  }
  location.replace((target || paths['zh-CN']) + location.search + location.hash);
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151b21;color:#ece9df;font:16px/1.8 Arial,'Microsoft YaHei',sans-serif}nav{text-align:center}a{color:#ece9df;margin:0 .55em;text-underline-offset:3px}</style>
</head>
<body>
<nav aria-label="选择语言">
<a href="/zh-cn/">简体中文</a>
<a href="/zh-hant/">繁體中文</a>
<a href="/en/">English</a>
<a href="/ja/">日本語</a>
<a href="/ru/">Русский</a>
</nav>
</body>
</html>
